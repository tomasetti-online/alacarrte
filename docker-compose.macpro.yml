# EXAMPLE production deployment (the Tomasetti Tech lab's macpro setup).
# Uses local builds (no published image), Plex auto-send, Gotify + Home Assistant
# notifications, and a GLUTUN-backed proxy via ALACARTTE_VPN_PROXY. Adjust volumes,
# IPs, ports and the ALACARTTE_GOTIFY_TOKEN for your own host. The base
# docker-compose.yml is the supported, dependency-free quick start.

services:
  alacarrte:
    image: alacarrte
    container_name: alacarrte
    restart: always
    ports:
      - "3080:8080"
    volumes:
      - /srv/docker/downloader/data:/data
      - /mnt/plex-music:/plex-music:rw
    environment:
      - ALACARTTE_SECRET_KEY=CHANGEME_PLACEHOLDER
      - ALACARTTE_ADMIN_IPS=10.0.0.2,10.0.0.3,10.0.0.4,10.0.0.5,10.0.0.7,127.0.0.1
      - ALACARTTE_PLEX_DIR=/plex-music
      - ALACARTTE_GOTIFY_URL=https://gotify.tomasetti.online/message
      - ALACARTTE_GOTIFY_TOKEN=ROTATE-AND-PASTE-NEW-TOKEN
      - ALACARTTE_HA_WEBHOOK=https://ha.tomasetti.online/api/webhook/tomasetti_uptime_iphone
      - ALACARTTE_CONCURRENCY=6
      - ALACARTTE_SLEEP_REQUESTS=1.5
