<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ALACarrte Options</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0a0a0f; color:#e0e0e0; max-width:520px; margin:40px auto; padding:0 16px; }
  h1 { font-size:1.2rem; color:#fff; }
  label { display:block; margin-top:16px; font-size:0.9rem; color:#bbb; }
  input[type=url] { width:100%; box-sizing:border-box; margin-top:6px; padding:8px; border-radius:6px; border:1px solid #2a2a35; background:#111118; color:#fff; }
  .hint { font-size:0.8rem; color:#888; margin-top:6px; line-height:1.4; }
  button { margin-top:18px; padding:10px 20px; background:#5b8def; color:#fff; border:none; border-radius:6px; font-size:0.95rem; font-weight:600; cursor:pointer; }
  button:hover { background:#4a7de0; }
  #status { margin-top:12px; font-size:0.9rem; }
  .ok { color:#6ee7b7; } .err { color:#f87171; }
</style>
</head>
<body>
  <h1>ALACarrte — Options</h1>
  <label for="api">ALACarrte instance URL</label>
  <input type="url" id="api" placeholder="http://localhost:8080" />
  <div class="hint">The base URL of your ALACarrte server (no trailing slash). If it is not localhost, the extension will ask for permission to reach it the first time you use it.</div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
