<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0f; color: #e0e0e0; width: 380px; padding: 16px;
}
h1 { font-size: 1.1rem; color: #fff; margin-bottom: 12px; }
#status { color: #888; font-size: 0.85rem; margin-bottom: 12px; }
.track { padding: 4px 0; font-size: 0.9rem; border-bottom: 1px solid #1a1a24; }
.track .num { color: #666; width: 24px; display: inline-block; }
.track .artist { color: #5b8def; }
.track .title { color: #ccc; }
.album-label { font-size: 0.75rem; color: #5b8def; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
#dl-btn {
  display: none; width: 100%; padding: 10px; margin-top: 12px;
  background: #5b8def; color: #fff; border: none; border-radius: 6px;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
}
#dl-btn:hover { background: #4a7de0; }
#url { display: none; }
.spinner {
  margin: 20px auto; width: 24px; height: 24px;
  border: 2px solid #333; border-top-color: #5b8def; border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none; }
.sv-track { display:flex;align-items:center;gap:6px;padding:4px 0;font-size:0.85rem;border-bottom:1px solid #1a1a24; }
.sv-track .num { color:#666;width:22px;display:inline-block;flex-shrink:0; }
.sv-track .sv-name { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc; }
.sv-ok { color:#3fb950;font-size:0.78rem;flex-shrink:0; }
.sv-err { color:#f85149;font-size:0.78rem;flex-shrink:0; }
.sv-pending { color:#888;font-size:0.78rem;flex-shrink:0; }
.sv-retry { background:#1a1230;color:#a78bfa;border:1px solid #2a1f4a;border-radius:4px;font-size:0.72rem;cursor:pointer;padding:1px 6px;flex-shrink:0; }
.sv-progress-bar { background:#1a1a24;border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px; }
.sv-progress-fill { background:#5b8def;height:100%;width:0%; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
  <img src="icon48.png" alt="" style="width:32px;height:32px;border-radius:6px">
  <h1 style="margin:0;font-size:1rem">ALACarrte</h1>
</div>
<div id="status">Loading current page...</div>
<div id="tracks"></div>
<button id="dl-btn">Download All as ALAC</button>
<button id="cookie-btn" style="display:none;width:100%;padding:6px;margin-top:6px;background:#1a1230;color:#a78bfa;border:1px solid #2a1f4a;border-radius:6px;font-size:0.8rem;cursor:pointer">Send YouTube Cookies to Server</button>
<div class="spinner hidden" id="spinner"></div>

<div id="status-view" class="hidden">
  <div class="album-label">Download</div>
  <div id="sv-album" style="font-size:0.85rem;color:#ccc;margin-bottom:4px"></div>
  <div id="sv-progress" style="font-size:0.8rem;color:#888;margin-bottom:8px"></div>
  <div id="sv-tracks"></div>
</div>
</body>
<script src="popup.js"></script>
</html>
